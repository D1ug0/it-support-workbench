services:
  app:
    build: .
    ports:
      - '127.0.0.1:${WORKBENCH_LAB_PORT:-18880}:8080'
    environment:
      LAB_ROLE: app
    read_only: true
    tmpfs:
      - /state:uid=10001,gid=10001,mode=0700
      - /tmp:uid=10001,gid=10001,mode=0700
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [lab]
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8080/ready", timeout=2)',
        ]
      interval: 5s
      timeout: 3s
      retries: 3
  dependency:
    build: .
    environment:
      LAB_ROLE: dependency
    read_only: true
    tmpfs:
      - /state:uid=10001,gid=10001,mode=0700
      - /tmp:uid=10001,gid=10001,mode=0700
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [lab]
networks:
  lab:
    internal: true
